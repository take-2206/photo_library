<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bản đồ ảnh</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4eee2;--paper2:#ebe3d3;--ink:#3a2f27;--mute:#8a7d6d;--red:#8c3b2a;--dark:#2b2420;--line:#d8cdb8;
--serif:"IM Fell English",Georgia,serif;--mono:"Courier Prime","Courier New",monospace;
--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--serif)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}

/* map */
#map{position:fixed;inset:0;background:var(--paper2)}
.leaflet-tile-pane{filter:sepia(.7) saturate(.7) contrast(.92) brightness(1.04)}
.leaflet-container{font-family:var(--serif)}
#map::after{content:"";position:absolute;inset:0;z-index:450;pointer-events:none;background:var(--grain),radial-gradient(ellipse at center,transparent 55%,rgba(90,60,30,.22))}
.leaflet-top.leaflet-left{top:env(safe-area-inset-top,0);margin-top:64px}
.leaflet-bar a{background:var(--paper);color:var(--ink);border-color:var(--line)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--paper);color:var(--ink);box-shadow:0 6px 18px rgba(60,40,20,.35)}
.leaflet-popup-content-wrapper{border-radius:3px}
.leaflet-control-attribution{background:rgba(244,238,226,.8)!important}

/* chrome */
#brand{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:500;background:var(--paper);border:1px solid var(--line);padding:8px 12px;box-shadow:0 2px 8px rgba(60,40,20,.2)}
.pill{background:var(--dark);color:#f4eee2;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;box-shadow:0 8px 20px rgba(40,25,10,.35)}
#openAlbum{position:fixed;left:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:500}
#fab{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:500;width:58px;height:58px;border:0;background:var(--red);color:#f4eee2;font:2rem/1 var(--mono);cursor:pointer;border-radius:4px;box-shadow:0 8px 20px rgba(40,25,10,.4),inset 0 0 0 3px var(--red),inset 0 0 0 4px rgba(244,238,226,.5)}
.pin{width:26px;height:26px;background:var(--red);border:3px solid var(--paper);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pin.new{background:var(--dark)}
.pin span{display:block;width:20px;height:20px;transform:rotate(45deg);color:var(--paper);font:700 12px/20px var(--mono);text-align:center}
.pop{width:230px}
.pi{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.pi:last-child{border:0}
.pi img{width:62px;height:62px;flex:none;object-fit:cover;border:3px solid #fbf7ee;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pi b{font-weight:400;display:block;line-height:1.2}
.pop small{display:block;color:var(--mute);line-height:1.2}
.pop button{margin:8px 6px 0 0;padding:4px 10px;border:1px solid var(--ink);background:none;cursor:pointer}
.pop button.del{border-color:var(--red);color:var(--red)}

/* add sheet = tấm vé */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:600;max-width:420px;margin:0 auto;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));transform:translateY(115%);transition:transform .3s}
#sheet.open{transform:none}
#ticketWrap{filter:drop-shadow(0 10px 18px rgba(50,30,10,.4))}
.ticket{--stub:96px;position:relative;background:#f1e7d0 var(--grain);border-left:6px solid var(--red);border-radius:6px;
 -webkit-mask:radial-gradient(circle 11px at 0 calc(100% - var(--stub)),#0000 97%,#000),radial-gradient(circle 11px at 100% calc(100% - var(--stub)),#0000 97%,#000);
 -webkit-mask-composite:source-in;
 mask:radial-gradient(circle 11px at 0 calc(100% - var(--stub)),#0000 97%,#000),radial-gradient(circle 11px at 100% calc(100% - var(--stub)),#0000 97%,#000);
 mask-composite:intersect}
.tmain{padding:14px 18px 16px;display:grid;gap:10px}
.thead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:6px}
.thead strong{font:italic 1.4rem var(--serif)}
#close{background:none;border:0;font-size:1.7rem;line-height:1;cursor:pointer;color:var(--mute);padding:0 2px}
.tmeta{display:flex;justify-content:space-between;align-items:center;color:var(--mute)}
.dt{display:flex;align-items:center;gap:6px}
.dt input{font:.8rem var(--mono);color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--ink);padding:2px 0;border-radius:0}
#slot{position:relative;display:grid;place-items:center;height:104px;border:2px dashed var(--mute);background:rgba(120,90,50,.06);color:var(--mute);overflow:hidden;cursor:pointer}
#file{position:absolute;z-index:3;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
#preview{position:absolute;inset:0;display:none;grid-auto-rows:1fr;gap:2px;background:var(--paper2)}
#preview img{width:100%;height:100%;min-height:0;object-fit:cover;filter:sepia(.2)}
#cnt{position:absolute;right:6px;bottom:6px;z-index:2;display:none;background:var(--dark);color:var(--paper);padding:2px 9px;border-radius:99px;pointer-events:none}
.field{display:grid;gap:2px}
.field label{color:var(--mute)}
.field input{width:100%;padding:4px 0;background:none;border:0;border-bottom:1px dashed var(--ink);font:1.05rem var(--serif);border-radius:0}
.field input:focus-visible{outline:0;border-bottom:2px solid var(--red)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
#find{padding:5px 12px;background:none;border:1px solid var(--ink);cursor:pointer;font-family:var(--mono);text-transform:uppercase;font-size:.75rem}
#hint{margin:0;color:var(--mute);font-size:.85rem;min-height:1.3em}
.perf{height:0;border-top:2px dashed #b9a98a;margin:0 14px}
.stub{height:var(--stub);padding:12px 18px 14px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.barcode{height:52px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.85}
.main{padding:14px 18px;background:var(--red);color:#f4eee2;border:0;cursor:pointer;font-family:var(--mono);text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;border-radius:3px;box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 4px rgba(244,238,226,.5)}
button:disabled{opacity:.5}

/* album */
#album{position:fixed;inset:0;z-index:800;background:var(--paper) var(--grain);display:none;overflow:hidden}
#album.open{display:block}
#back{position:absolute;left:20px;top:calc(18px + env(safe-area-inset-top,0px));background:none;border:0;cursor:pointer;z-index:5}
#counter{position:absolute;left:20px;top:50%}
#caption{position:absolute;right:20px;top:50%;text-align:right;max-width:22vw;z-index:5}
#caption b{display:block;font-weight:400}
#caption button{margin-top:10px;background:none;border:0;border-bottom:1px solid var(--red);color:var(--red);cursor:pointer;padding:0}
#stack{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;touch-action:pan-y}
.card{position:absolute;width:min(66vmin,520px);aspect-ratio:1;padding:min(2.2vmin,16px);background:#efe9de var(--grain);box-shadow:0 14px 34px rgba(60,40,20,.28),0 1px 2px rgba(60,40,20,.3);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
.card img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.18) contrast(.98)}
#index{position:absolute;inset:0;display:none;overflow:auto;padding:96px 20px 150px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;align-content:start}
#album.idx #index{display:grid}
#album.idx #stack,#album.idx #counter,#album.idx #caption,#album.stm #stack,#album.stm #counter,#album.stm #caption{display:none}
#index figure{margin:0;padding:8px;background:#efe9de;box-shadow:0 4px 12px rgba(60,40,20,.25);cursor:pointer}
#index img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
#index figcaption{margin-top:6px}
#toggle{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:18px;z-index:5}
#toggle button{background:none;border:0;cursor:pointer;color:#8f8272}
#toggle button.on{color:#fff}
#stamps{position:absolute;inset:0;display:none;overflow:auto;padding:96px 22px 120px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px;align-content:start}
#album.stm #stamps{display:grid}
.stamp{--pc:#efe5cf;padding:12px 12px 10px;border:0;cursor:pointer;text-align:center;color:var(--ink);font:inherit;
 background:radial-gradient(circle at 6px 0,#0000 4px,var(--pc) 4.5px) 0 0/12px 12px repeat-x,
  radial-gradient(circle at 6px 100%,#0000 4px,var(--pc) 4.5px) 0 100%/12px 12px repeat-x,
  radial-gradient(circle at 0 6px,#0000 4px,var(--pc) 4.5px) 0 0/12px 12px repeat-y,
  radial-gradient(circle at 100% 6px,#0000 4px,var(--pc) 4.5px) 100% 0/12px 12px repeat-y,
  linear-gradient(var(--pc),var(--pc)) center/calc(100% - 20px) calc(100% - 20px) no-repeat;
 filter:drop-shadow(0 3px 5px rgba(60,40,20,.35));transition:transform .2s}
.stamp:hover{transform:rotate(-1.5deg) translateY(-3px)}
.stamp .sin{position:relative;aspect-ratio:4/5;background:var(--paper2);overflow:hidden;border:1px solid rgba(60,40,20,.3)}
.stamp img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.25)}
.stamp .sc{position:absolute;right:4px;top:4px;background:var(--paper);padding:0 6px;font-size:.7rem}
.stamp b{display:block;font-weight:400;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp small{display:block;color:var(--mute)}
.stamp.new .sin{display:grid;place-items:center;border:2px dashed var(--mute);background:none;font:2.4rem var(--mono);color:var(--mute)}
#index figure{position:relative}
.ck{position:absolute;right:14px;top:14px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(40,30,20,.4);display:none;color:#fff;font:700 14px/20px var(--mono);text-align:center}
#index.selecting .ck{display:block}
#index figure.sel{outline:3px solid var(--red)}
#index figure.sel .ck{background:var(--red)}
#index figure.sel .ck::after{content:"✓"}
#selBtn{position:absolute;right:20px;top:calc(18px + env(safe-area-inset-top,0px));display:none;z-index:5;background:none;border:1px solid var(--ink);padding:5px 12px;cursor:pointer}
#albBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));z-index:5;display:none;gap:12px;align-items:center;white-space:nowrap}
#albBar #albRen{border-bottom:0;color:var(--ink);line-height:0;vertical-align:middle;padding:2px}
#albBar #albRen:hover{color:var(--red)}
#albBar button{background:none;border:0;border-bottom:1px solid var(--red);color:var(--red);cursor:pointer;padding:0}
#selBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;display:none;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:max-content;max-width:94vw;background:var(--paper);border:1px solid var(--line);padding:10px 12px;box-shadow:0 6px 18px rgba(60,40,20,.35)}
#selBar select,#selBar button{font:inherit;padding:6px 10px;background:var(--paper2);border:1px solid var(--ink);border-radius:0;cursor:pointer}
#selBar #selDel{border-color:var(--red);color:var(--red)}
#caption button{display:block;margin-left:auto}
@media (max-width:640px){#caption button{margin-left:0}}
#selBar #selSave{background:var(--red);color:var(--paper);border-color:var(--red)}
#empty{position:absolute;inset:0;pointer-events:none;display:none;place-items:center;text-align:center;color:var(--mute);padding:0 24px}
@media (max-width:640px){#caption{top:auto;bottom:90px;left:20px;right:20px;max-width:none;text-align:left}#counter{top:auto;bottom:130px;left:20px;display:none}.card{width:78vw}}
@media (prefers-reduced-motion:reduce){.card,#sheet{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="brand" class="mono">✦ Bản đồ ảnh · <span id="n">0</span></div>
<button id="openAlbum" class="pill mono">Xem ảnh</button>
<button id="fab" aria-label="Thêm ảnh">+</button>

<section id="sheet" aria-label="Thêm ảnh">
 <div id="ticketWrap"><form id="form" class="ticket">
  <div class="tmain">
    <div class="thead"><strong>Vé ảnh</strong><button type="button" id="close" aria-label="Đóng">×</button></div>
    <div class="tmeta mono"><span id="serial"></span><label class="dt">Ngày chụp <input type="date" id="tdate" required></label></div>
    <label id="slot" class="mono"><span>+ Chạm để chọn ảnh (tối đa 10)</span><div id="preview"></div><span id="cnt" class="mono"></span><input id="file" type="file" accept="image/*" multiple required></label>
    <div class="field"><label class="mono" for="title">Tên album</label><input id="title" placeholder="Ví dụ: Chuyến Hạ Long" required autocomplete="off"></div>
    <div class="row">
      <div class="field"><label class="mono" for="place">Địa điểm</label><input id="place" placeholder="Hồ Gươm, Hà Nội" required autocomplete="off"></div>
      <button type="button" id="find">Tìm</button>
    </div>
    <p id="hint"></p>
  </div>
  <div class="perf"></div>
  <div class="stub"><div class="barcode" aria-hidden="true"></div><button type="submit" class="main" id="save">Lưu ảnh</button></div>
 </form></div>
</section>

<section id="album" aria-label="Album ảnh">
  <button id="back" class="mono">← Bản đồ</button>
  <div id="counter" class="mono"></div>
  <div id="caption" class="mono"><b id="cTitle"></b><span id="cMeta"></span><br><button id="cLocate">Xem trên bản đồ</button><button id="cDel">Xóa ảnh</button></div>
  <button id="selBtn" class="mono">Chọn &amp; lưu</button>
  <div id="albBar" class="mono"><span>Album: <b id="albName"></b></span><button id="albRen" aria-label="Đổi tên album" title="Đổi tên album"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button><button id="albDel">Xóa album</button></div>
  <div id="stamps"></div>
  <div id="stack"></div>
  <div id="index"></div>
  <div id="selBar" class="mono"><span id="selCount"></span><select id="selAlbum" aria-label="Chọn album"></select><button id="selSave">Lưu vào album</button><button id="selDl">Tải về</button><button id="selDel">Xóa</button></div>
  <div id="empty" class="mono">Chưa có ảnh nào ở đây.<br>Thêm ảnh bằng nút + trên bản đồ.</div>
  <div id="toggle" class="pill mono"><button id="mSlide" class="on">Slide</button><button id="mIndex">Index</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// === ĐIỀN THÔNG TIN SUPABASE CỦA BẠN (Project Settings > API) ===
const SUPABASE_URL = "https://qjgneejvshmzeijbuhjn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_B_Iw_ldl9N7LmZpGRBEcRQ_kzk2ICX3";
// ================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const map = L.map("map", {zoomControl:false}).setView([16.0, 106.0], 6);
L.control.zoom({position:"topleft"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);

const icon = (cls, n) => L.divIcon({className:"", html:`<div class="pin ${cls||""}">${n > 1 ? `<span>${n}</span>` : ""}</div>`, iconSize:[26,26], iconAnchor:[6,26], popupAnchor:[8,-26]});
const HINT = "Chạm vào bản đồ để chọn hoặc đổi vị trí.";
let markerOf = {}, picked = null, newMarker = null, markers = [], photos = [], cur = 0;
const fmtDate = p => { const d = p.taken_at || (p.created_at||"").slice(0,10); return d ? d.split("-").reverse().join("/") : ""; };
const url = p => db.storage.from("photos").getPublicUrl(p).data.publicUrl;
const isOpen = () => $("sheet").classList.contains("open");

/* ---------- thêm ảnh ---------- */
function openSheet(){ $("serial").textContent = "Nº " + String(Math.floor(Math.random()*1e6)).padStart(6,"0"); $("tdate").value = new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10); $("sheet").classList.add("open"); $("hint").textContent = picked ? "" : HINT; }
function closeSheet(){
  $("sheet").classList.remove("open"); $("form").reset(); $("preview").style.display = "none"; $("preview").innerHTML = ""; $("cnt").style.display = "none";
  if(newMarker){ newMarker.remove(); newMarker = null; } picked = null;
}
function setPick(ll){
  picked = ll;
  if(newMarker) newMarker.setLatLng(ll); else newMarker = L.marker(ll, {icon:icon("new")}).addTo(map);
  $("hint").textContent = `Vị trí: ${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`;
}
async function geocode(q){
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=vi&q=" + encodeURIComponent(q));
  return (await r.json())[0];
}
async function reverse(ll){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&accept-language=vi&lat=${ll.lat}&lon=${ll.lng}`);
    const j = await r.json(); return j.name || (j.display_name || "").split(",").slice(0,2).join(",").trim();
  }catch{ return ""; }
}
$("fab").onclick = () => isOpen() ? closeSheet() : openSheet();
$("close").onclick = closeSheet;
$("find").onclick = async () => {
  const q = $("place").value.trim(); if(!q) return $("place").focus();
  $("hint").textContent = "Đang tìm…";
  try{
    const g = await geocode(q);
    if(!g) return $("hint").textContent = "Không tìm thấy. Thử ghi cụ thể hơn hoặc chạm vào bản đồ.";
    const ll = L.latLng(+g.lat, +g.lon); setPick(ll); map.flyTo(ll, 14);
  }catch{ $("hint").textContent = "Lỗi tìm kiếm. Hãy chạm vào bản đồ."; }
};
map.on("click", async e => {
  const was = isOpen(); setPick(e.latlng); if(!was) openSheet();
  $("place").value = "Đang lấy tên địa điểm…";
  const name = await reverse(e.latlng); $("place").value = name;
});
$("file").onchange = () => {
  let fs = [...$("file").files], over = fs.length > 10;
  if(over){ const dt = new DataTransfer(); fs.slice(0, 10).forEach(f => dt.items.add(f)); $("file").files = dt.files; fs = fs.slice(0, 10); }
  const pv = $("preview"); pv.innerHTML = "";
  fs.forEach(f => { const im = document.createElement("img"); im.alt = ""; im.src = URL.createObjectURL(f); pv.appendChild(im); });
  pv.style.gridTemplateColumns = `repeat(${Math.min(fs.length, 5)},1fr)`;
  pv.style.display = fs.length ? "grid" : "none";
  $("cnt").textContent = `${fs.length}/10`; $("cnt").style.display = fs.length ? "block" : "none";
  if(over) $("hint").textContent = "Chỉ lấy 10 ảnh đầu tiên.";
};
$("form").onsubmit = async e => {
  e.preventDefault();
  if(!picked){ $("hint").textContent = "Hãy bấm Tìm hoặc chạm vào bản đồ để chọn vị trí."; return; }
  const files = [...$("file").files].slice(0, 10); if(!files.length) return;
  const title = $("title").value, place = $("place").value, taken_at = $("tdate").value, {lat, lng} = picked;
  $("save").disabled = true;
  const rows = [], uploaded = []; let failed = 0;
  for(let i = 0; i < files.length; i++){
    $("save").textContent = `Đang lưu ${i + 1}/${files.length}…`;
    const f = files[i], path = `${Date.now()}-${i}-${f.name.replace(/[^\w.-]/g, "_")}`;
    const up = await db.storage.from("photos").upload(path, f);
    if(up.error){ failed++; continue; }
    uploaded.push(path);
    rows.push({title: files.length > 1 ? `${title} (${i + 1}/${files.length})` : title, place, taken_at, lat, lng, path});
  }
  let album_id = null, aerr = null;
  if(rows.length){
    const nm = title.trim();
    album_id = (albums.find(a => a.name.trim().toLowerCase() === nm.toLowerCase()) || {}).id || null;
    if(!album_id){ const r = await db.from("albums").insert({name:nm}).select().single(); if(r.error) aerr = r.error; else album_id = r.data.id; }
    rows.forEach(r => r.album_id = album_id);
  }
  if(aerr){ await db.storage.from("photos").remove(uploaded); alert("Không tạo được album: " + aerr.message + "\nHãy chạy phần SQL album trong setup.sql."); }
  else if(!rows.length) alert("Không tải được ảnh nào. Kiểm tra lại kết nối và bucket photos.");
  else{
    const ins = await db.from("photos").insert(rows);
    if(ins.error){ await db.storage.from("photos").remove(uploaded); alert("Lỗi lưu dữ liệu: " + ins.error.message); }
    else{ if(failed) alert(`Đã lưu ${rows.length} ảnh, ${failed} ảnh bị lỗi.`); closeSheet(); await load(); }
  }
  $("save").disabled = false; $("save").textContent = "Lưu ảnh";
};

/* ---------- tải & ghim ---------- */
async function load(){
  const {data, error} = await db.from("photos").select("*").order("taken_at", {ascending:false}).order("created_at", {ascending:false});
  if(error) return alert("Không tải được ảnh: " + error.message);
  photos = data; $("n").textContent = data.length;
  markers.forEach(m => m.remove()); markers = []; markerOf = {};
  const groups = {};
  data.forEach((p, i) => { (groups[p.lat.toFixed(5) + "," + p.lng.toFixed(5)] ||= []).push(i); });
  Object.values(groups).forEach(idxs => {
    const p0 = photos[idxs[0]];
    const m = L.marker([p0.lat, p0.lng], {icon:icon("", idxs.length)}).addTo(map);
    const box = document.createElement("div"); box.className = "pop";
    idxs.forEach(i => {
      const p = photos[i], r = document.createElement("div"); r.className = "pi";
      r.innerHTML = '<img alt=""><div><b></b><small></small><button class="alb">Mở</button><button class="del">Xóa</button></div>';
      r.querySelector("img").src = url(p.path);
      r.querySelector("b").textContent = p.title || "";
      r.querySelector("small").textContent = [p.place, fmtDate(p)].filter(Boolean).join(" · ");
      r.querySelector(".alb").onclick = () => openAlbum(i);
      r.querySelector(".del").onclick = () => del(p);
      box.appendChild(r); markerOf[p.id] = m;
    });
    m.bindPopup(box, {maxHeight:270}); markers.push(m);
  });
  if(data.length) map.fitBounds(data.map(p => [p.lat, p.lng]), {padding:[70,70], maxZoom:12});
  const a = await db.from("albums").select("*").order("created_at");
  albums = a.error ? [] : a.data;
  buildAlbum();
}
async function removePhotos(ps){
  if(!ps.length || !confirm(ps.length > 1 ? `Xóa ${ps.length} ảnh đã chọn?` : "Xóa ảnh này?")) return false;
  const {error} = await db.from("photos").delete().in("id", ps.map(p => p.id));
  if(error){ alert("Không xóa được ảnh: " + error.message); return false; }
  await db.storage.from("photos").remove(ps.map(p => p.path));
  return true;
}
async function del(p){ if(await removePhotos([p])){ map.closePopup(); load(); } }

/* ---------- album: tem, chồng ảnh, index, chọn & lưu ---------- */
let albums = [], curAlbum = null, list = [], mode = "slide", selecting = false, sel = new Set();
const N = () => list.length;
const rot = i => ((i * 37) % 13) - 6;
const albumPhotos = id => photos.filter(p => p.album_id === id);
const unsorted = () => photos.filter(p => !p.album_id);
const syncList = () => { list = curAlbum === null ? [] : curAlbum === "none" ? unsorted() : albumPhotos(curAlbum); };
const el = (tag, cls, txt) => { const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };

async function newAlbum(){
  const name = (prompt("Tên album mới:") || "").trim(); if(!name) return null;
  const {data, error} = await db.from("albums").insert({name}).select().single();
  if(error){ alert("Không tạo được album: " + error.message + "\nHãy chắc chắn đã chạy phần SQL album trong setup.sql."); return null; }
  return data.id;
}
function stamp(cover, name, sub, count, cls, onclick){
  const b = el("button", "stamp " + (cls || "")), sin = el("div", "sin");
  if(cover){ const im = el("img"); im.alt = ""; im.src = url(cover.path); sin.appendChild(im); }
  else if(cls === "new") sin.textContent = "+";
  if(count != null) sin.appendChild(el("span", "sc mono", "×" + count));
  b.append(sin, el("b", "mono", name), el("small", "mono", sub || ""));
  b.onclick = onclick; return b;
}
function openIn(id){ curAlbum = id; cur = 0; buildAlbum(); }
function buildStamps(){
  const box = $("stamps"); box.innerHTML = "";
  albums.forEach(a => { const ps = albumPhotos(a.id); box.appendChild(stamp(ps[0], a.name, ps.length ? fmtDate(ps[0]) : "trống", ps.length, "", () => openIn(a.id))); });
  const un = unsorted();
  if(un.length) box.appendChild(stamp(un[0], "Chưa phân loại", "", un.length, "", () => openIn("none")));
  box.appendChild(stamp(null, "Album mới", "", null, "new", async () => { const id = await newAlbum(); if(id) await load(); }));
  const sa = $("selAlbum"); sa.innerHTML = "";
  const add = (v, t, d) => { const o = el("option", "", t); o.value = v; if(d) o.disabled = true; sa.appendChild(o); };
  add("", "Chọn album…", true); add("none", "Bỏ khỏi album"); albums.forEach(a => add(a.id, a.name)); add("new", "+ Album mới…");
  sa.selectedIndex = 0;
}
function buildAlbum(){
  if(curAlbum && curAlbum !== "none" && !albums.some(a => a.id === curAlbum)) curAlbum = null;
  if(curAlbum === "none" && !unsorted().length) curAlbum = null;
  syncList(); buildStamps();
  $("stack").innerHTML = ""; $("index").innerHTML = "";
  list.forEach((p, i) => {
    const c = el("div", "card"); c.innerHTML = '<img alt="" draggable="false">'; c.firstChild.src = url(p.path); $("stack").appendChild(c);
    const f = el("figure"); f.innerHTML = '<img alt="" loading="lazy"><i class="ck"></i><figcaption class="mono"></figcaption>';
    f.querySelector("img").src = url(p.path); f.querySelector("figcaption").textContent = p.title || "";
    f.onclick = () => { if(selecting) toggleSel(p.id); else { cur = i; setMode("slide"); render(); } };
    $("index").appendChild(f);
  });
  cur = Math.min(cur, Math.max(N() - 1, 0));
  refreshSel(); apply(); render();
}
function render(){
  const n = N();
  if(!n){ $("counter").textContent = ""; $("cTitle").textContent = ""; $("cMeta").textContent = ""; $("cLocate").style.display = $("cDel").style.display = "none"; return; }
  [...$("stack").children].forEach((c, i) => {
    const d = (i - cur + n) % n;
    if(d === 0){ c.style.transform = "none"; c.style.opacity = 1; }
    else if(d === n - 1 && n > 1){ c.style.transform = "translateX(-70vw) rotate(-14deg)"; c.style.opacity = 0; }
    else { c.style.transform = `translate(${rot(i) * 3}px, ${d * 6}px) rotate(${rot(i)}deg)`; c.style.opacity = d < 6 ? 1 : 0; }
    c.style.zIndex = n - d;
  });
  const p = list[cur];
  $("counter").textContent = `${cur + 1}/${n}`;
  $("cTitle").textContent = p.title || "Không tên";
  $("cMeta").textContent = [p.place, fmtDate(p)].filter(Boolean).join(" · ");
  $("cLocate").style.display = $("cDel").style.display = "block";
}
const go = d => { if(N()){ cur = (cur + d + N()) % N(); render(); } };

function refreshSel(){
  $("index").classList.toggle("selecting", selecting);
  [...$("index").children].forEach((f, i) => f.classList.toggle("sel", !!list[i] && sel.has(list[i].id)));
}
function toggleSel(id){ sel.has(id) ? sel.delete(id) : sel.add(id); refreshSel(); renderBar(); }
function renderBar(){
  const inAlb = curAlbum !== null, idxView = inAlb && mode === "index";
  $("selBar").style.display = (idxView && selecting && sel.size) ? "flex" : "none";
  $("selCount").textContent = `${sel.size} ảnh`;
  $("selBtn").style.display = idxView ? "block" : "none";
  $("selBtn").textContent = selecting ? "Xong" : "Chọn & lưu";
  $("albBar").style.display = inAlb ? "flex" : "none";
  if(inAlb){
    $("albName").textContent = curAlbum === "none" ? "Chưa phân loại" : (albums.find(a => a.id === curAlbum) || {}).name || "";
    $("albRen").style.display = "inline"; $("albDel").style.display = curAlbum === "none" ? "none" : "inline";
  }
}
function apply(){
  const A = $("album"), inAlb = curAlbum !== null;
  $("toggle").style.display = inAlb ? "flex" : "none";
  A.classList.toggle("stm", !inAlb); A.classList.toggle("idx", inAlb && mode === "index");
  $("mSlide").classList.toggle("on", mode === "slide"); $("mIndex").classList.toggle("on", mode === "index");
  if(!(inAlb && mode === "index")){ selecting = false; sel.clear(); refreshSel(); }
  $("empty").style.display = (inAlb ? !N() : (!albums.length && !unsorted().length)) ? "grid" : "none";
  $("back").textContent = inAlb ? "← Album" : "← Bản đồ";
  renderBar();
}
function setMode(m){ mode = m; apply(); }
function openAlbum(i){
  if(typeof i === "number"){ const p = photos[i]; curAlbum = p.album_id || "none"; syncList(); cur = Math.max(list.indexOf(p), 0); mode = "slide"; }
  else curAlbum = null;
  buildAlbum(); $("album").classList.add("open"); map.closePopup(); render();
}
$("openAlbum").onclick = () => openAlbum();
$("back").onclick = () => { if(curAlbum !== null){ curAlbum = null; buildAlbum(); } else $("album").classList.remove("open"); };
$("mSlide").onclick = () => setMode("slide");
$("mIndex").onclick = () => setMode("index");
$("albRen").onclick = async () => {
  if(curAlbum === "none"){
    const ps = unsorted(), name = (prompt(`Đặt tên cho ${ps.length} ảnh chưa phân loại (chúng sẽ thành một album):`) || "").trim();
    if(!name) return;
    let id = (albums.find(x => x.name.trim().toLowerCase() === name.toLowerCase()) || {}).id;
    if(!id){ const r = await db.from("albums").insert({name}).select().single(); if(r.error) return alert("Không tạo được album: " + r.error.message); id = r.data.id; }
    const {error} = await db.from("photos").update({album_id:id}).in("id", ps.map(p => p.id));
    if(error) return alert("Không chuyển được ảnh: " + error.message);
    curAlbum = id; await load(); return;
  }
  const a = albums.find(x => x.id === curAlbum); if(!a) return;
  const name = (prompt("Tên album mới:", a.name) || "").trim();
  if(!name || name === a.name) return;
  if(albums.some(x => x.id !== a.id && x.name.trim().toLowerCase() === name.toLowerCase())) return alert("Đã có album tên này. Hãy chọn tên khác.");
  const {error} = await db.from("albums").update({name}).eq("id", a.id);
  if(error) return alert("Không đổi được tên: " + error.message);
  await load();
};
$("albDel").onclick = async () => {
  if(!confirm("Xóa album này? Ảnh vẫn được giữ lại.")) return;
  const {error} = await db.from("albums").delete().eq("id", curAlbum);
  if(error) return alert("Không xóa được album: " + error.message);
  curAlbum = null; await load();
};
$("selBtn").onclick = () => { selecting = !selecting; if(!selecting) sel.clear(); refreshSel(); renderBar(); };
$("selSave").onclick = async () => {
  const v = $("selAlbum").value; if(!v) return alert("Hãy chọn album để lưu.");
  let album_id = v === "none" ? null : v;
  if(v === "new"){ album_id = await newAlbum(); if(!album_id) return; }
  const {error} = await db.from("photos").update({album_id}).in("id", [...sel]);
  if(error) return alert("Lỗi lưu vào album: " + error.message);
  sel.clear(); selecting = false; await load();
};
$("selDel").onclick = async () => {
  if(await removePhotos(photos.filter(p => sel.has(p.id)))){ sel.clear(); selecting = false; await load(); }
};
$("cDel").onclick = async () => { const p = list[cur]; if(p && await removePhotos([p])) await load(); };
$("selDl").onclick = async () => {
  for(const id of sel){
    const p = photos.find(x => x.id === id); if(!p) continue;
    try{
      const b = await (await fetch(url(p.path))).blob(), a = el("a");
      a.href = URL.createObjectURL(b); a.download = (p.title || "anh") + "." + (p.path.split(".").pop() || "jpg"); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }catch{ alert("Không tải được ảnh: " + (p.title || "")); }
  }
};
$("cLocate").onclick = () => { const p = list[cur], m = markerOf[p.id]; $("album").classList.remove("open"); map.flyTo([p.lat, p.lng], 15); if(m) m.openPopup(); };
$("stack").onclick = e => go(e.clientX < innerWidth * 0.25 ? -1 : 1);
let sx = null;
$("stack").addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
$("stack").addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx) > 40){ go(dx < 0 ? 1 : -1); e.preventDefault(); } });
addEventListener("keydown", e => {
  if(!$("album").classList.contains("open")) return;
  if(e.key === "ArrowRight") go(1); else if(e.key === "ArrowLeft") go(-1); else if(e.key === "Escape") $("back").click();
});
load();
</script>
